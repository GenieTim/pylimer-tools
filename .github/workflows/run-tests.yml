name: Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Run Python + C++ Tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/cache@v4
        with:
          path: |
            ./build
            ./vendor/igraph
            ./vendor/igraph-skbuild
            ./vendor/nlopt
            ./vendor/nlopt-skbuild
            ./vendor/cereal
            ./vendor/cereal-skbuild
            ./tests/build
          key: pt-${{ runner.os }}-py-3.13
          restore-keys: |
            pt-${{ runner.os }}-py-3.13

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: sudo apt-get install bison flex lcov libeigen3-dev

      - name: Run Tests
        run: ./bin/run-tests-short.sh

      # Generate Coverage Badge
      - name: Install Badge Generator
        run: pip install genbadge[coverage]

      - run: find . -type f -name 'coverage.xml'

      - name: Coverage Badge
        run: genbadge coverage -i coverage.xml -o ".github/coverage.svg"

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          fail_ci_if_error: false # optional (default = false)
          verbose: true # optional (default = false)
          # gcov: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)
          directory: ./test-reports/

      # Commit Coverage Badge if applicable
      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@v20
        id: changed_files
        with:
          files: .github/coverage.svg

      - name: Commit files
        if: steps.changed_files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/coverage.svg
          git commit -m "Updated coverage.svg"

      - name: Push changes
        if: steps.changed_files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.github_token }}
          branch: ${{ github.ref }}
