name: Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.rst"
      - ".gitignore"
      - ".github/workflows/publish-documentation-html.yml"
      - ".github/workflows/check-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Run Python + C++ Tests
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpp:
              - "src/pylimer_tools_cpp/**"
              - "tests/pylimer_tools_cpp/**"
              - "CMakeLists.txt"
              - "tests/CMakeLists.txt"
              - "vendor/**"
              - "setup.py"
              - "bin/build-tests.sh"
              - "bin/config-tests-build.sh"
              - ".github/workflows/run-tests.yml"

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-py-3.13
          max-size: 2G

      - name: Cache built C++ extension
        id: cpp-ext-cache
        uses: actions/cache@v6
        with:
          path: |
            src/*.so
            src/*.dylib
            src/*.pyd
            build
            tests/build
            ./vendor/igraph*
            ./vendor/nlopt*
            ./vendor/cereal*
          key: cpp-ext-${{ runner.os }}-py-3.13-${{ hashFiles('src/pylimer_tools_cpp/**', 'tests/pylimer_tools_cpp/**', 'CMakeLists.txt', 'tests/CMakeLists.txt', 'setup.py', 'vendor/**', 'requirements.txt') }}
          restore-keys: |
            cpp-ext-${{ runner.os }}-py-3.13-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: sudo apt-get install -y bison flex lcov libeigen3-dev ninja-build

      - name: Run Tests
        run: ./bin/run-tests-short.sh
        env:
          CI: true
          CMAKE_BUILD_TYPE: RelWithDebInfo
          ENABLE_LEAK_ANALYSIS: "1"
          RUN_CPP_TESTS: ${{ (steps.filter.outputs.cpp == 'true' || steps.cpp-ext-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch') && '1' || '0' }}

      # Generate Coverage Badge
      - name: Install Badge Generator
        run: pip install genbadge[coverage]

      - run: find . -type f -name 'coverage.xml'

      - name: Coverage Badge
        run: genbadge coverage -i coverage.xml -o ".github/coverage.svg"

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          fail_ci_if_error: false # optional (default = false)
          verbose: true # optional (default = false)
          # gcov: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)
          directory: ./test-reports/

      # Commit Coverage Badge if applicable
      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@v20
        id: changed_files
        with:
          files: |
            .github/coverage.svg
            .github/cpp-coverage.svg

      - name: Commit files
        if: steps.changed_files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/coverage.svg
          git add .github/cpp-coverage.svg
          git commit -m "Updated coverage badges [skip ci]"

      - name: Push changes
        if: steps.changed_files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.github_token }}
          branch: ${{ github.ref }}
