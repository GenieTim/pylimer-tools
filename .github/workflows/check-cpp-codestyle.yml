name: C/C++ Code Style Check

on: [push, pull_request]

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     path:
    #       - "src"
    #       - "tests"
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Installing astyle from pip leads to a more modern version
      # - run: sudo apt-get install libeigen3-dev astyle
      - run: python -m pip install astyle

      - run: python -m astyle --version

      - run: python -m astyle --project=.astylerc --recursive '*.cpp' '*.h'

      # If anything changed, this will fail and show the needed changes
      - run: git diff --exit-code

