name: C/C++ Code Style Check

on:
  push:
    paths:
      - "src/**.cpp"
      - "src/**.h"
      - "tests/**.cpp"
      - "tests/**.h"
      - ".clang-format"
      - ".github/workflows/check-cpp-codestyle.yml"
  pull_request:
    paths:
      - "src/**.cpp"
      - "src/**.h"
      - "tests/**.cpp"
      - "tests/**.h"
      - ".clang-format"
      - ".github/workflows/check-cpp-codestyle.yml"

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - "src"
          - "tests"
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Run clang-format style check on C/C++ code
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "21"
          check-path: ${{ matrix.path }}
          fallback-style: "Mozilla" # optional
