name: Run Tests on Windows

on:
  workflow_dispatch:
  push:
    branches:
      - workflow_dispatch
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.rst"
      - ".gitignore"
      - ".github/workflows/publish-documentation-html.yml"
      - ".github/workflows/check-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: windows-latest

    name: Run Python + C++ Tests on Windows
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/cache@v6
        with:
          path: |
            .\vendor\*-Windows
            .\tests\build
            ~\AppData\Local\pip\Cache
            ~\AppData\Local\Temp\chocolatey
            .\vendor\igraph
            .\_skbuild
          key: ${{ runner.os }}-py-3.12-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py-3.12-

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Install choco dependencies
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install -y winflexbison3 eigen lcov

      - name: Build
        run: pip install . --verbose
        env:
          CI: true
          CMAKE_BUILD_TYPE: Release

      - name: Run Tests
        run: python -m coverage run -m unittest discover -v
        env:
          CI: true
