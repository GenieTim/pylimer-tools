name: Publish HTML Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "requirements.txt"
      - "setup.py"
      - "CMakeLists.txt"
      - "vendor/**"
      - "bin/make-docs.sh"
      - ".github/workflows/publish-documentation-html.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    name: Build & Publish Documentation to GitHub Pages
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ./_skbuild
            ./vendor/igraph
            ./vendor/igraph-skbuild
            ./vendor/nlopt
            ./vendor/nlopt-skbuild
            ./vendor/cereal
            ./vendor/cereal-skbuild
            ./docs/auto_examples
            ./docs/gen_modules
            ./docs-html
          key: ${{ runner.os }}-docs-3.12-${{ hashFiles('**/requirements.txt', 'docs/**') }}
          restore-keys: |
            ${{ runner.os }}-docs-3.12-

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: sudo apt-get install bison flex

      - name: Install pylimer-tools
        run: python -m pip install .

      - name: Generate Documentation
        run: ./bin/make-docs.sh

      - name: Publish Documentation
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: ./docs-html/ # The folder the action should deploy.
