name: flake8 Lint

on:
  push:
    paths:
      - "src/**.py"
      - "tests/**.py"
      - "bin/**.py"
      - "setup.py"
      - ".flake8"
      - ".github/workflows/check-python-codestyle.yml"
  pull_request:
    paths:
      - "src/**.py"
      - "tests/**.py"
      - "bin/**.py"
      - "setup.py"
      - ".flake8"
      - ".github/workflows/check-python-codestyle.yml"

jobs:
  flake8-lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: flake8 Lint
        uses: py-actions/flake8@v2
        with:
          ignore: "W605,W503,W504"
          max-line-length: "150"
          exclude: "src/pylimer_tools_cpp/__init__.py"
          path: "src"
          plugins: "pep8-naming"
